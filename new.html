<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ウマレース</title>
<style>
body {
    margin: 0;
    font-family: "Zen Maru Gothic", sans-serif;
    background: rgb(176, 61, 61);
    color: #ffd17de2;
}

.site-header {
    display: flex;
    gap: 12px;
    justify-content: center;
    padding: 12px;
    background: rgba(0, 0, 0, 0.45);
    border-bottom: 2px solid #fcf591;
}
.site-header a {
    color: #fcf591;
    text-decoration: none;
    padding: 4px 16px;
    border-radius: 6px;
}
.site-header a:hover {
    background: rgba(255, 255, 255, 0.15);
}
.site-header a[aria-current="page"] {
    background: #fcf591;
    color: #7a2020;
    font-weight: bold;
}
:root{--bg:#f3efe2;--ink:#1f2a1c;--sub:#5a6350;--turf:#4f7a3a;--card:#fffdf6;--line:#d8d2bd;--gold:#b8860b;--btn:#1f2a1c;--btntxt:#f3efe2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151b12;--ink:#ece8d8;--sub:#a3ab97;--turf:#3d5e2d;--card:#1e271a;--line:#33402c;--gold:#e0b341;--btn:#ece8d8;--btntxt:#151b12}}
:root[data-theme="dark"]{--bg:#151b12;--ink:#ece8d8;--sub:#a3ab97;--turf:#3d5e2d;--card:#1e271a;--line:#33402c;--gold:#e0b341;--btn:#ece8d8;--btntxt:#151b12}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.6}
main{max-width:680px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.6rem;margin:0 0 4px}
p.lead{margin:0 0 16px;color:var(--sub)}
button{font:inherit;font-weight:700;background:var(--btn);color:var(--btntxt);border:0;border-radius:6px;padding:10px 20px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h2{font-size:1.1rem;margin:24px 0 8px}
#msg{min-height:1.6em;margin:12px 0 0;font-weight:700}
.lane{display:grid;grid-template-columns:auto 9em 1fr;gap:8px;align-items:center;margin-bottom:6px;padding:4px 6px;border-radius:6px;cursor:pointer}
.lane:has(input:checked){background:var(--card);outline:2px solid var(--gold)}
.lane input{accent-color:var(--gold)}
.label{font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run{position:relative;height:2.2rem;background:var(--turf);border-radius:4px;overflow:hidden}
.goal{position:absolute;right:0;top:0;bottom:0;width:8px;background:repeating-linear-gradient(0deg,#fff 0 4px,#222 4px 8px)}
.horse{position:absolute;top:0;left:0;font-size:1.5rem;line-height:2.2rem}
ol{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:8px}
ol:empty{display:none}
li{display:flex;gap:12px;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li .rank{font-weight:700;min-width:2.6em}
li:first-child .rank{color:var(--gold)}
li .meta{margin-left:auto;color:var(--sub);font-size:.85rem;text-align:right}
</style>
</head>
<body>
  <header class="site-header">
    <nav>
        <a href="index.html">スロットゲーム</a>
        <a href="other.html" aria-current="page">競馬のようなゲーム</a>
    </nav>
  </header>

<main>
  <h1>ウマレース</h1>
  <p class="lead">1位になりそうなレーンを選んで、レース開始！</p>

  <h2>出走表</h2>
  <div id="track"></div>
  <p id="msg" aria-live="polite"></p>
  <button id="go">レース開始</button>

  <h2>ランキング</h2>
  <ol id="ranking"></ol>
</main>

<script>
const NAMES = [
  "ハシルシール","ゴーゴーホース","ケーバハヤースギー","サイキョーバリキ",
  "ムテキテンサイ","バリキツヨイウマ","ウンコクサーイ","シャイニングスター","シンボロルドルフ"
];
const btn = document.getElementById("go");
const track = document.getElementById("track");
const ol = document.getElementById("ranking");
const msg = document.getElementById("msg");
let racers = [];
let state = "ready";   // ready(投票待ち) / running(レース中) / finished(終了)

// 出走表を作る(ページを開いた時と「もう一回」で呼ばれる)
function setup() {
  const name = [...NAMES];
  racers = [];
  track.innerHTML = "";
  ol.innerHTML = "";

  for (let ch = 1; ch <= 7; ch++) {
    const i = Math.floor(Math.random() * name.length);
    const horse = name.splice(i, 1)[0];
    const speed = Math.floor(Math.random() * 100) + 1;

    const lane = document.createElement("label");
    lane.className = "lane";
    lane.innerHTML = `<input type="radio" name="vote" value="${ch}"><span class="label">第${ch}レーン ${horse}</span><div class="run"><span class="horse">🏇</span><span class="goal"></span></div>`;
    track.appendChild(lane);

    racers.push({
      horse, ch, speed,
      time: 10000 - speed * 50,
      phase: Math.random() * 6.28,
      el: lane.querySelector(".horse"),
      done: false
    });
  }
  state = "ready";
  btn.textContent = "レース開始";
  btn.disabled = true;               // 投票するまで押せない
  msg.textContent = "まずは、1位だと思うレーンに投票してね";
}

function run() {
  state = "running";
  btn.disabled = true;
  track.querySelectorAll("input").forEach(i => i.disabled = true);
  const vote = Number(track.querySelector("input:checked").value);
  const myRacer = racers.find(r => r.ch === vote);   // 自分が選んだ馬のデータ
  const myHorse = myRacer.horse;                      // 自分が選んだ馬の名前
  let myRank = null;                                  // 自分が選んだ馬の順位(ゴールするまでは null)
  msg.textContent = `スタート！ あなたの馬は「${myHorse}」`;

  let finished = 0;
  let winner = null;
  const start = performance.now();

  function frame(now) {
    const t = Math.max(now - start, 0);
    racers.forEach(r => {
      if (r.done) return;
      const p = Math.min(t / r.time, 1);
      const wobble = Math.sin(p * 14 + r.phase) * 0.03 * (1 - p);
      const pos = Math.min(Math.max(p + wobble, 0), 1);
      r.el.style.left = `calc(${pos} * (100% - 2.4rem))`;
      if (p >= 1) {
        r.done = true;
        finished++;
        if (finished === 1) winner = r;
        if (r === myRacer) myRank = finished;   // 自分の馬がゴールした瞬間に順位を記録
        const li = document.createElement("li");
        li.innerHTML = `<span class="rank">${finished}位</span><span>${r.horse}</span><span class="meta">第${r.ch}レーン / 速さ${r.speed}</span>`;
        ol.appendChild(li);
      }
    });
    if (finished < racers.length) {
      requestAnimationFrame(frame);
    } else {
      // 全頭ゴール → 当たり・はずれの判定
      if (myRank === 1) {
        msg.textContent = `当たり！ あなたの${myHorse}が1位だったよ！`;
      } else {
        msg.textContent = `はずれ… あなたの${myHorse}は${myRank}位。1位は${winner.horse}だったよ`;
      }
      state = "finished";
      btn.textContent = "もう一回";
      btn.disabled = false;
    }
  }
  requestAnimationFrame(frame);
}

track.addEventListener("change", () => { if (state === "ready") btn.disabled = false; });
btn.addEventListener("click", () => {
  if (state === "ready") run();
  else if (state === "finished") setup();
});

setup();
</script>
</body>
</html>
